version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cve_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./sql/03_permissions.sql:/docker-entrypoint-initdb.d/03_permissions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d cve_db -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true
    networks:
      - default
